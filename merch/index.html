<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/KiraLogoV5.png?v=1736122362">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=arrow_back" />

  <link rel="stylesheet" href="/Styles/merch.css">
  <title>KiraSan</title>


</head>

<body>

    <!-- CURSOR SPARKLES -->
    <script src="/Scripts/Sparkles/cursorSparkles.js"></script>

  <div id="announcementBar">

    <div id="backArrowContainer">

      <div id="backArrow">

        <script>
          document.addEventListener('DOMContentLoaded', () => {
            const backArrow = document.getElementById('backArrow');
            backArrow.onclick = () => {
              window.location.href = "https://kirasanart.com/";
            };
          });
        </script>
      </div>

    </div>

  </div>

  <div id="productsContainer">

    <div class="product">
      <a href="https://kirasanart.com/merch/KiraSan%20-%20Skull%20Sculpture%20in%20Resin/" class="productLink">
        <div class="imageContainer">
          <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/skull.gif?v=1740198995" alt="" class="productImage">
        </div>
      </a>
    </div>
	
    <!-- Do not delete -->
    <div class="product"></div>
    <!-- Do not delete -->

  </div>

  <!-- LOADING SCREEN -->
  <div id="loadingScreen" style="display: none;">
    <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/walkingman.gif?v=1739661193" alt="Loading...">
</div>

<script>
    document.getElementById('backArrow').addEventListener('click', function (event) {
        event.preventDefault(); // Prevent the default link behavior
        var loadingScreen = document.getElementById('loadingScreen');
        loadingScreen.style.display = 'flex'; // Show the loading screen

        // Set a timeout to hide the loading screen and navigate to the link
        setTimeout(function () {
            loadingScreen.style.display = 'none'; // Hide the loading screen
            window.location.href = event.target.parentElement.href; // Navigate to the link
        }, 2003); // 3000 milliseconds = 3 seconds
    });
</script>

</body>

</html>
