    <style>
        /* Loading screen styles */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; /* Ensure it covers everything */
        }
        #loadingScreen img {
            width: 200px; /* Adjust size as needed */
            height: auto;
        }
    </style>
</head>
