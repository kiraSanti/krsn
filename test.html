<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/KiraLogoV5.png?v=1736122362"
        type="image/x-icon">
    <title>KiraSan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Styles/home.css">


</head>

<body>

    <script>
        function loadPage(filePath, containerId) {
            fetch(filePath) // Fetch the local file from the same directory
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to load " + filePath);
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById(containerId).innerHTML = data;
                })
                .catch(error => console.error(error));
        }
    
        // Load intro.html first
        loadPage("intro.html", "contentContainer");
    
        // After 5 seconds, replace it with home.html
        setTimeout(() => {
            loadPage("index.html", "contentContainer");
        }, 5000);
    </script>
    
    <!-- Container to hold dynamic content -->
    <div id="contentContainer"></div>
    

</body>

</html>
