<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/KiraLogoV5.png?v=1736122362"
        type="image/x-icon">
    <title>KiraSan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Styles/home.css">

</head>

<body>

    <!-- LOADING SCREEN INITIAL -->
    <div id="loadingScreenInitial">
        <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/Screenrecording2025-03-037.46.14PM-ezgif.com-speed.gif?v=1741049377"
            alt="Loading...">
    </div>
    <script>
        // Hide loading screen after 5 seconds and show the main content
        setTimeout(function () {
            document.getElementById('loadingScreenInitial').style.display = 'none';
        }, 4500);
    </script>

    <!-- KIRITA ANIMATED LOGO -->
    <div id="kiritaAnimatedLogoContainer">
        <img id="kiritaAnimatedLogo"
            src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/output-onlinegiftools.gif?v=1740864945"
            width="12%" height="auto">
    </div>

    <!-- PEXELS THUMBNAIL & CURSOR SPARKLES-->
    <div id="pexelsThumbnailContainer">
        <img id="pexelsThumbnail" />
    </div>
    <script src="/Scripts/PexelsThumbnailnSparkles/pexelsThumbnailnSparkles.js"></script>

    <!-- TYPED QUOTES -->
    <div id="typedtext"></div>
    <script src="/Scripts/Typewriter/typewriter.js"></script>

    <!-- MENU GIFS -->
    <div id="gifsContainer">
        <a id="merch" class="mainPageClickableGifs" href="https://kirasanart.com/merch/">
            <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/skull.gif?v=1728538993" width="50"
                height="50">
        </a>
        <a id="youtube" class="mainPageClickableGifs" href="https://www.youtube.com/@kirasanart" target="_blank">
            <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/Youtube_Logo_Sticker.gif?v=1737335920"
                width="37" height="37">
        </a>
        <a id="emailUs" class="mainPageClickableGifs" href="mailto:kirasaninfo@gmail.com" target="_blank">
            <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/mailLips.gif?v=1737334183"
                alt="Description of the image" width="29" height="25">
        </a>
        <a id="iLoveCoffe" class="mainPageClickableGifs" href="https://buymeacoffee.com/" target="_blank">
            <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/iLoveCoffe.gif?v=1737333228" width="39"
                height="45">
        </a>
    </div>


    <!-- LOADING SCREEN -->
    <div id="loadingScreen" style="display: none;">
        <img src="https://cdn.shopify.com/s/files/1/0724/1505/2001/files/walkingman.gif?v=1739661193" alt="Loading...">
    </div>

    <script>
        document.getElementById('merch').addEventListener('click', function (event) {
            event.preventDefault(); // Prevent the default link behavior
            var loadingScreen = document.getElementById('loadingScreen');
            loadingScreen.style.display = 'flex'; // Show the loading screen

            // Set a timeout to hide the loading screen and navigate to the link
            setTimeout(function () {
                loadingScreen.style.display = 'none'; // Hide the loading screen
                window.location.href = event.target.parentElement.href; // Navigate to the link
            }, 2003); // 3000 milliseconds = 3 seconds
        });
    </script>



</body>

</html>
